# 演练命名空间与配额：只创建放置对象的地方，不创建任何账号/权限对象。
# Chaos Mesh 的 enableFilterNamespace=true 只允许注入带
#   chaos-mesh.org/inject: enabled
# 注解的命名空间；默认只有 training-lab 开启。
# Chaos Mesh 本身请用 Helm 安装到 chaos-mesh 命名空间（见 install.sh 输出）。
apiVersion: v1
kind: Namespace
metadata:
  name: training-lab
  labels:
    app.kubernetes.io/part-of: k8s-fault-lab
  annotations:
    chaos-mesh.org/inject: enabled
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: training-lab-quota
  namespace: training-lab
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
    services: "10"
    persistentvolumeclaims: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: training-lab-limits
  namespace: training-lab
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
